# AlphaESS Battery Optimizer: example dashboard view (sections).
# Generated by dashboard/build_view.py, edit that file instead.
#
# Needs apexcharts-card from HACS (Frontend) for the plan chart.
# Entity IDs assume an inverter device called "AlphaESS Inverter" and a Nord Pool
# sensor called sensor.nordpool_kwh_nl_eur_3_10_0. Replace them if yours differ;
# see docs/dashboard.md.
title: Battery
path: battery
icon: mdi:home-battery
type: sections
max_columns: 3
badges:
- type: entity
  entity: sensor.alphaess_inverter_battery_state_of_charge
- type: entity
  entity: sensor.alphaess_inverter_inverter_power
- type: entity
  entity: sensor.optimizer_alphaess_inverter_action
sections:
- type: grid
  column_span: 3
  cards:
  - type: heading
    heading: Battery plan
    heading_style: title
  - type: conditional
    conditions:
    - condition: state
      entity: sensor.nordpool_kwh_nl_eur_3_10_0
      attribute: tomorrow_valid
      state: 'true'
    card:
      type: custom:apexcharts-card
      header:
        show: true
        show_states: false
        title: Battery plan today and tomorrow
      graph_span: 2d
      span:
        start: day
      now:
        show: true
        label: Now
      experimental:
        color_threshold: true
      apex_config:
        legend:
          show: true
        chart:
          height: 400
          width: 100%
      yaxis:
      - id: price
        decimals: 2
        apex_config:
          title:
            text: €/kWh
      - id: soc
        opposite: true
        min: 0
        max: 100
        decimals: 0
        apex_config:
          title:
            text: SoC %
      - id: action
        show: false
        min: 0
        max: 1
      series:
      - entity: sensor.optimizer_alphaess_inverter_action
        name: Charge
        yaxis_id: action
        type: area
        curve: stepline
        stroke_width: 0
        color: '#2e7d32'
        opacity: 0.3
        show:
          legend_value: false
        data_generator: |
          const q = entity.attributes.plan_quarters || [];
          const now = Date.now();
          const out = q.map(p => [Math.max(new Date(p[0]).getTime(), now), p[1] === 'charge' ? 1 : 0]);
          if (q.length) out.push([new Date(q[q.length - 1][0]).getTime() + 900000, 0]);
          return out;
      - entity: sensor.optimizer_alphaess_inverter_action
        name: Charge (past)
        yaxis_id: action
        type: area
        curve: stepline
        stroke_width: 0
        color: '#2e7d32'
        opacity: 0.3
        extend_to: now
        show:
          legend_value: false
          in_legend: false
        transform: 'return x === ''charge'' ? 1 : 0;'
      - entity: sensor.optimizer_alphaess_inverter_action
        name: Discharge
        yaxis_id: action
        type: area
        curve: stepline
        stroke_width: 0
        color: '#c62828'
        opacity: 0.3
        show:
          legend_value: false
        data_generator: |
          const q = entity.attributes.plan_quarters || [];
          const now = Date.now();
          const out = q.map(p => [Math.max(new Date(p[0]).getTime(), now), p[1] === 'discharge' ? 1 : 0]);
          if (q.length) out.push([new Date(q[q.length - 1][0]).getTime() + 900000, 0]);
          return out;
      - entity: sensor.optimizer_alphaess_inverter_action
        name: Discharge (past)
        yaxis_id: action
        type: area
        curve: stepline
        stroke_width: 0
        color: '#c62828'
        opacity: 0.3
        extend_to: now
        show:
          legend_value: false
          in_legend: false
        transform: 'return x === ''discharge'' ? 1 : 0;'
      - entity: sensor.optimizer_alphaess_inverter_action
        name: Hold
        yaxis_id: action
        type: area
        curve: stepline
        stroke_width: 0
        color: '#f9a825'
        opacity: 0.3
        show:
          legend_value: false
        data_generator: |
          const q = entity.attributes.plan_quarters || [];
          const now = Date.now();
          const out = q.map(p => [Math.max(new Date(p[0]).getTime(), now), p[1] === 'hold' ? 1 : 0]);
          if (q.length) out.push([new Date(q[q.length - 1][0]).getTime() + 900000, 0]);
          return out;
      - entity: sensor.optimizer_alphaess_inverter_action
        name: Hold (past)
        yaxis_id: action
        type: area
        curve: stepline
        stroke_width: 0
        color: '#f9a825'
        opacity: 0.3
        extend_to: now
        show:
          legend_value: false
          in_legend: false
        transform: 'return x === ''hold'' ? 1 : 0;'
      - entity: sensor.optimizer_alphaess_inverter_action
        name: Balance
        yaxis_id: action
        type: area
        curve: stepline
        stroke_width: 0
        color: '#4fc3f7'
        opacity: 0.18
        show:
          legend_value: false
        data_generator: |
          const q = entity.attributes.plan_quarters || [];
          const now = Date.now();
          const out = q.map(p => [Math.max(new Date(p[0]).getTime(), now), p[1] === 'balance' ? 1 : 0]);
          if (q.length) out.push([new Date(q[q.length - 1][0]).getTime() + 900000, 0]);
          return out;
      - entity: sensor.optimizer_alphaess_inverter_action
        name: Balance (past)
        yaxis_id: action
        type: area
        curve: stepline
        stroke_width: 0
        color: '#4fc3f7'
        opacity: 0.18
        extend_to: now
        show:
          legend_value: false
          in_legend: false
        transform: 'return x === ''balance'' ? 1 : 0;'
      - entity: sensor.nordpool_kwh_nl_eur_3_10_0
        name: Price
        yaxis_id: price
        type: line
        curve: stepline
        stroke_width: 2
        color_threshold:
        - value: 0
          color: Pink
        - value: 0.1
          color: Blue
        - value: 0.15
          color: Light Blue
        - value: 0.2
          color: Cyan
        - value: 0.25
          color: Green
        - value: 0.3
          color: Lime
        - value: 0.35
          color: Yellow
        - value: 0.4
          color: Orange
        - value: 0.45
          color: Red
        - value: 0.5
          color: Purple
        data_generator: |
          const a = entity.attributes;
          const r = [...(a.raw_today || []), ...(a.tomorrow_valid ? (a.raw_tomorrow || []) : [])];
          return r.map(p => [new Date(p.start).getTime(), Number(p.value)]);
      - entity: sensor.optimizer_alphaess_inverter_action
        name: SoC plan
        yaxis_id: soc
        type: line
        curve: straight
        stroke_width: 2
        stroke_dash: 4
        color: '#1e88e5'
        show:
          legend_value: false
        data_generator: |
          return (entity.attributes.plan_quarters || []).map(p =>
            [new Date(p[0]).getTime() + 15 * 60 * 1000, p[2]]);
      - entity: sensor.alphaess_inverter_battery_state_of_charge
        name: SoC
        yaxis_id: soc
        type: line
        stroke_width: 2
        color: '#1e88e5'
        extend_to: now
        group_by:
          func: last
          duration: 15min
      - entity: sensor.nordpool_kwh_nl_eur_3_10_0
        name: Range
        yaxis_id: price
        type: line
        stroke_width: 0
        opacity: 0
        color: transparent
        show:
          in_header: false
          legend_value: false
          in_legend: false
        data_generator: |
          const a = entity.attributes;
          const r = [...(a.raw_today || []), ...(a.tomorrow_valid ? (a.raw_tomorrow || []) : [])].map(p => Number(p.value)).filter(v => !isNaN(v));
          if (!r.length) return [];
          const t0 = new Date(); t0.setHours(0, 0, 0, 0);
          const lo = Math.floor((Math.min(...r) - 0.02) * 100) / 100;
          const hi = Math.ceil((Math.max(...r) + 0.02) * 100) / 100;
          return [[t0.getTime(), hi], [t0.getTime() + 1000, lo]];
    grid_options:
      columns: full
  - type: conditional
    conditions:
    - condition: state
