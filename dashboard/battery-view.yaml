    grid_options:
      columns: 12
      rows: 1
  - type: tile
    entity: sensor.optimizer_alphaess_inverter_next_hold
    name: Next hold
    icon: mdi:battery-lock
    grid_options:
      columns: 12
      rows: 1
  - type: tile
    entity: number.optimizer_alphaess_inverter_aggressiveness
    name: Aggressiveness (1 = own use, 10 = profit)
    icon: mdi:tune-variant
    grid_options:
      columns: 12
      rows: 2
    features:
    - type: numeric-input
      style: slider
  - type: tile
    entity: number.optimizer_alphaess_inverter_backup_target
    name: Backup target
    icon: mdi:battery-heart-variant
    grid_options:
      columns: 6
      rows: 2
    features:
