- type: grid
  cards:
  - type: heading
    heading: Live
    heading_style: title
  - type: entity
    entity: sensor.alphaess_inverter_inverter_power
    state_color: false
    grid_options:
      columns: 6
      rows: 2
    name: Inverter power
    icon: mdi:flash
  - type: entity
    entity: sensor.alphaess_inverter_battery_state_of_charge
    state_color: false
    grid_options:
      columns: 6
      rows: 2
    name: Battery SoC
  - type: entity
    entity: sensor.alphaess_inverter_current_pv_production
    state_color: false
    grid_options:
      columns: 6
      rows: 2
    name: PV production
    icon: mdi:solar-power-variant
  - type: entity
    entity: sensor.optimizer_alphaess_inverter_action
    state_color: false
    grid_options:
      columns: 6
      rows: 2
    name: Optimizer
    icon: mdi:battery-sync
  - type: entity
    entity: sensor.alphaess_inverter_grid_power
    state_color: false
    grid_options:
      columns: 6
      rows: 2
    name: Grid power
    icon: mdi:transmission-tower-import
  - type: entity
    entity: sensor.alphaess_inverter_current_house_load
    state_color: false
    grid_options:
      columns: 6
      rows: 2
    name: House load
    icon: mdi:home-lightning-bolt
  - type: tile
    entity: select.alphaess_inverter_dispatch_mode
    name: Dispatch mode
    icon: mdi:battery-sync-outline
    grid_options:
      columns: 12
      rows: 1
  - type: entity
    entity: sensor.optimizer_alphaess_inverter_reserve
    state_color: false
    grid_options:
      columns: 6
      rows: 2
    name: Reserve
    icon: mdi:battery-lock
  - type: entity
    entity: sensor.optimizer_alphaess_inverter_charge_ceiling
    state_color: false
    grid_options:
      columns: 6
      rows: 2
    name: Max % from grid
    icon: mdi:transmission-tower-import
- type: grid
  cards:
  - type: heading
    heading: Optimizer
    heading_style: title
  - type: tile
    entity: sensor.optimizer_alphaess_inverter_action
    name: Optimizer now
    icon: mdi:battery-sync
    grid_options:
      columns: 12
      rows: 1
    state_content:
    - reason
  - type: tile
    entity: sensor.optimizer_alphaess_inverter_next_charge
    name: Next charge
    icon: mdi:battery-arrow-up
    grid_options:
      columns: 12
